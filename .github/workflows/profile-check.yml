name: Check profile

on:
  pull_request:
    paths:
      - "README.md"
      - "profile.json"
      - "scripts/update_profile.py"
      - ".github/workflows/profile-check.yml"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Check generated sections
        run: python scripts/update_profile.py --check
