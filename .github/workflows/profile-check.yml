name: Check profile

on:
  pull_request:
    paths:
      - "README.md"
      - "profile.json"
      - "scripts/update_profile.py"
      - ".github/workflows/profile-check.yml"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check generated sections
        run: python scripts/update_profile.py --check
