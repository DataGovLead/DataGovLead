name: Check profile

on:
  pull_request:
    paths:
      - "README.md"
      - "profile.json"
      - "scripts/update_profile.py"
      - ".github/workflows/profile-check.yml"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Check generated sections
        run: python scripts/update_profile.py --check
